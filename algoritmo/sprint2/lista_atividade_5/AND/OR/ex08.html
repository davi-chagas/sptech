<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 08</title>
</head>
<body>
    <h1>Sistema de Avaliação de Atendimento: Dê Sua Nota! </h1>

    <label for="ipt_nota_atendimento">Insira a nota do atendimento: </label>
    <input type="text" id="ipt_nota_atendimento"> 

    <button onclick="avaliar()">Avaliar atendimento</button>

    <div id="div_result"></div>
</body>
<script>
    function avaliar(){
        let nota_atendimento = Number(ipt_nota_atendimento.value);

        if(nota_atendimento < 0 || nota_atendimento > 10){
            div_result.innerHTML = 'Notá inválida'
        } else if(nota_atendimento >= 0 && nota_atendimento < 5){
            div_result.innerHTML = 'Não aprovado'
        } else if (nota_atendimento >= 5 && nota_atendimento <= 6){
            div_result.innerHTML = 'Neutro'
        } else {
            div_result.innerHTML = 'Aprovado'
        }
    }
</script>
</html>
