<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Desempenho Escolar: O Aluno Foi Aprovado?</h1>

    <label for="ipt_nota">Insira a nota do aluno: </label>
    <input type="text" id="ipt_nota"> <br>

    <label for="ipt_frequencia">Insira a frequencia: </label>
    <input type="text" id="ipt_frequencia"> <br>

    <button onclick="analisar()">Analisar aluno</button>

    <div id="div_result"></div>
</body>
<script>
    function analisar() {
        let nota = Number(ipt_nota.value);
        let frequencia = Number(ipt_frequencia.value);

        if (nota < 0 || nota > 10) {
            alert('Onde já se viu nota <0 ou >10?!');
            div_result.innerHTML = '';
        } else if (frequencia < 0 || frequencia > 100) {
            alert('Onde já se viu frequência <0 ou >100?!')
            div_result.innerHTML = '';
        } else if (nota >= 0 && nota < 6){
            div_result.innerHTML = 'Aluno ficou abaixo da média <br>'
        } else if (nota >= 6 && nota <=8){
            div_result.innerHTML = 'Aluno ficou na média <br>'
        } else if (nota >8 && nota <= 10){
            div_result.innerHTML = 'Aluno acima da média <br>'
        } 
        
        if (frequencia >= 75){
            div_result.innerHTML += 'Aluno aprovado por frequência <br>'
        } else {
            div_result.innerHTML += 'Aluno reprovado por frequência <br>'
        }
    }
</script>

</html>
