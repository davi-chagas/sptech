<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 8</title>
</head>
<body>
    <h1>Sistema de Login: Autentique-se para Acessar!</h1>

    <label for="ipt_login">Insira o login: </label>
    <input type="text" id="ipt_login"> <br>

    <label for="ipt_senha">Insira a senha: </label>
    <input type="text" id="ipt_senha"> <br>

    <label for="ipt_codigo_seg">Insira o codigo de segurança: </label>
    <input type="text" id="ipt_codigo_seg"> <br>

    <button onclick="autenticar()">Entrar</button>
</body>
<script>
    function autenticar(){
        let login = ipt_login.value;
        let senha = ipt_senha.value;
        let codigo_seguranca = ipt_codigo_seg.value;

        if(login == 'SPTech' && senha == 'digital' && codigo_seguranca == '123'){
            alert('Usuário autenticado com sucesso')
        } else {
            alert('Falha na autenticação')
        }
    }
</script>
</html>
