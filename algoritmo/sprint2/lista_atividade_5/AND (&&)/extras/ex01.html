<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 4</title>
</head>

<body>
    <h1>Melhor Horário para Assistir Netflix: Evite Travamentos!</h1>

    <label for="select_horario">Selecione o horário que costuma ver netflix: </label>
    <select id="select_horario">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15">15</option>
        <option value="16">16</option>
        <option value="17">17</option>
        <option value="18">18</option>
        <option value="19">19</option>
        <option value="20">20</option>
        <option value="21">21</option>
        <option value="22">22</option>
        <option value="23">23</option>
    </select>

    <button onclick="analisar()">Ver recomendação</button>

    <div id="div_result"></div>
</body>
<script>
    function analisar() {
        let horario = Number(select_horario.value);

        if (horario >= 19 && horario <= 21) {
            div_result.innerHTML = `Não é recomendável que você assista sua série favorita no horário ${horario}!`
        } else {
            div_result.innerHTML = `O horário ${horario} é adequado para assistir sua série favorita!`
        }

    }
</script>

</html>
