<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
</head>
<body>
    <h1>Conforto Térmico: A Temperatura Está Ideal? </h1>

    <label for="ipt_temperatura">Insira a temperatura atual: </label>
    <input type="text" id="ipt_temperatura"> 

    <button onclick="analisar()">Ver situação</button>
</body>
<script>
    function analisar(){
        let temperatura = Number(ipt_temperatura.value);

        if(temperatura >= 21 && temperatura <= 24){
            alert('Temperatura confortável :D')
        } else {
            alert('Temperatura DESCONFORTÁVEL :C')
        }
    }
</script>
</html>
