<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 5</title>
</head>
<body>
    <h1>Alerta de Desconforto Térmico</h1>

    <label for="ipt_temperatura">Insira a temperatura atual: </label>
    <input type="text" id="ipt_temperatura"> <br>

    <button onclick="analisar()">Analisar clima</button>
</body>
<script>
    function analisar(){
        let temperatura = Number(ipt_temperatura.value);

        if(temperatura < 21 || temperatura > 24){
            alert('"Alerta de desconforto!')
        } else if (temperatura < 21){
            alert('As pessoas vão ter hipotermia')
        } else if (temperatura > 24){
            alert('As pessoas vão derreter')
        } 
    }
</script>
</html>
