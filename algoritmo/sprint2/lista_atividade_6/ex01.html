<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
</head>
<body>
    <h1>Contador de Caracteres</h1>

    <label for="ipt_frase">Insira uma frase: </label>
    <input type="text" id="ipt_frase">
    <button onclick="analisar()">Analisar frase</button>

    <div id="div_result"></div>
</body>
<script>
    function analisar(){
        let frase = ipt_frase.value;
        div_result.innerHTML  = `Tamanho da frase: ${frase.length}`

        if(frase.length < 10){
            div_result.innerHTML += `<p style="color:red;">Frase curta!</p>`
        } else {
            div_result.innerHTML += '<p style="color:blue;">Frase longa</p>'
        }

    }
</script>
</html>
