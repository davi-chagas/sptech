<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 6</title>
</head>
<body>
    <h1>Observador de Índices</h1>

    <label for="ipt_frase">Insira uma frase: </label>
    <input type="text" id="ipt_frase" onkeyup="analisar()"> <br>

    <label for="ipt_index">Insira a posição que deseja ver: </label>
    <input type="text" id="ipt_index" onkeyup="analisar()"> <br>

    <div id="div_result"></div>
</body>
<script>
    function analisar(){
        let frase = ipt_frase.value;
        let index = Number(ipt_index.value);
        let ultima_letra = frase.length - 1;

        div_result.innerHTML = `
        <p>A primeira letra é: ${frase[0]}</p>
        <p>A ${index} letra é: ${frase[index - 1]}</p>
        <p>A ultima letra é: ${frase[ultima_letra]}</p>`
    }
</script>
</html>
