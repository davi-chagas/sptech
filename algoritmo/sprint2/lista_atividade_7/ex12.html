<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 12</title>
</head>
<body>
    <h1>Papagaio Falante</h1>

    <label for="ipt_num">Insira um número: </label>
    <input type="text" id="ipt_num"> <br>

    <label for="ipt_frase">Insira uma frase: </label>
    <input type="text" id="ipt_frase"> <br>

    <button onclick="analisar()">papagaio</button>
</body>
<script>
    function analisar(){
        let num = Number(ipt_num.value);
        let frase = ipt_frase.value;
        let count = 1
        while(count <= num){
            alert(frase)
            count++
        }
    }
</script>
</html>
