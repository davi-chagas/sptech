<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 9</title>
</head>

<body>
    <h1>Viva o 7!</h1>

    <label for="ipt_num">Insira um número entre 0 e 200: </label>
    <input type="text" id="ipt_num">

    <button onclick="analisar()">Viva o 7!</button>

    <div id="div_result"></div>
</body>
<script>
    function analisar() {
        let num = Number(ipt_num.value);
        if (num < 0 || num > 200) {
            div_result.innerHTML = 'O número precisa estar entre 0 e 100'
        } else {
            let count = 7;
            while (count <= num) {
                div_result.innerHTML += `${count} <br>`
                count+=7;
            }
        }
    }
</script>

</html>
