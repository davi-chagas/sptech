<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 11</title>
</head>

<body>
    <h1>Tabuada Colorida</h1>

    <label for="ipt_num">Insira um número para checar a tabuada: </label>
    <input type="text" id="ipt_num"> <br>

    <label for="ipt_num_final">Insira o número final para ser construida: </label>
    <input type="text" id="ipt_num_final"> <br>

    <button onclick="analisar()">Ver tabuada</button>
    <div id="div_result"></div>
</body>
<script>
    function analisar() {
        let num = Number(ipt_num.value);
        let num_final = Number(ipt_num_final.value);
        let count = 1;
        while (count <= num_final) {
            if (count % 2 == 0) {
                div_result.innerHTML += `<span style="background-color:blue;">${num} x ${count} = ${num * count} </span> <br>`
            } else {
                div_result.innerHTML += `<span style="background-color:red;">${num} x ${count} = ${num * count} </span> <br>`
            }
            count++
        }
    }
</script>

</html>
