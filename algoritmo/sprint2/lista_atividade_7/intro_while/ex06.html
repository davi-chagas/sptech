<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 6</title>
</head>

<body>
    <h1>Filtro de Números Cabalísticos</h1>

    <button onclick="filtrar()">Filtrar números Cabalísticos</button>
    <div id="div_result"></div>
</body>
<script>
    function filtrar() {
        let count = 0;
        while (count <= 30) {
            if (count == 3 || count == 4) {
                count += 2;
            } else if (count == 7 || count == 10 || count == 12){
                count++;
            }

            div_result.innerHTML += `${count}`
            count++;

        }
    }
</script>

</html>
