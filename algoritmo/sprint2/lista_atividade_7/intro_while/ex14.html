<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 14</title>
</head>

<body>
    <h1>Divisibilidade</h1>

    <label for="ipt_intervalo_1">Insira o primeiro intervalo: </label>
    <input type="text" id="ipt_intervalo_1"> <br>

    <label for="ipt_intervalo_2">Insira o segundo intervalo: </label>
    <input type="text" id="ipt_intervalo_2"> <br>

    <label for="ipt_num_teste">Insira um número de teste: </label>
    <input type="text" id="ipt_num_teste"> <br>

    <button onclick="analisar()">Divisivel</button>

    <div id="div_result"></div>
</body>
<script>
    function analisar() {
        let intervalo_1 = Number(ipt_intervalo_1.value);
        let intervalo_2 = Number(ipt_intervalo_2.value);
        let num_teste = Number(ipt_num_teste.value);

        if (num_teste < 3 || num_teste > 13) {
            div_result.innerHTML = 'O número precisa estar entre 3 e 13'
        } else {
            div_result.innerHTML = '';
            while (intervalo_1 <= intervalo_2) {
                if (intervalo_1 % num_teste != 0) {
                    div_result.innerHTML += `${intervalo_1} <br>`
                }
                intervalo_1++;
            }
        }
    }
</script>

</html>
