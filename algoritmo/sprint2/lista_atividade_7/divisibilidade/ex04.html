<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 21</title>
</head>

<body>
    <h1>Contagem dos Múltiplos</h1>

    <label for="ipt_num">Insira um número positivo:</label>
    <input type="text" id="ipt_num"> <br>

    <label for="ipt_divisibilidade">Insira um número para divisibilidade:</label>
    <input type="text" id="ipt_divisibilidade"> <br>

    <button onclick="somar()">Somar números</button>

    <div id="div_result"></div>
    <div id="div_soma"></div>
</body>

<script>
    function somar() {
        let num = Number(ipt_num.value);
        let divisibilidade = Number(ipt_divisibilidade.value);

        if (divisibilidade < 1 || divisibilidade > num) {
            div_result.innerHTML = `O número de divisibilidade deve estar entre 1 e ${num}`;
        } else {

            let count = divisibilidade;
            let soma = 0;

            div_result.innerHTML = '';
            div_soma.innerHTML = '';

            while (count <= num) {
                div_result.innerHTML += `${count}<br>`;
                soma += count;
                count += divisibilidade;
            }

            div_soma.innerHTML = `Soma dos Múltiplos: ${soma}`;
        }
    }
</script>

</html>
