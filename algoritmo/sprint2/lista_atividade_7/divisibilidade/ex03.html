<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 20</title>
</head>

<body>
    <h1>Soma dos Pares</h1>

    <label for="ipt_num">Insira um número entre 10 e 500: </label>
    <input type="text" id="ipt_num">
    <button onclick="somar()">Somar pares</button>

    <div id="div_result"></div>
    <div id="div_soma"></div>
</body>
<script>
    function somar() {
        let num = Number(ipt_num.value);

        if (num < 10 || num > 500) {
            alert('O número deve estar entre 10 e 500');
        } else {
            let count = 1;
            let soma = 0;

            while (count <= num) {
                if (count % 2 == 0) {
                    div_result.innerHTML += `${count} <br>`
                    soma += count;
                }
                count++;
            }

            div_soma.innerHTML = `Soma dos pares: ${soma}<br>`
        }


    }
</script>

</html>
