<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 18</title>
</head>

<body>
    <h1>Divisores</h1>

    <label for="ipt_num">Insira um número: </label>
    <input type="text" id="ipt_num">

    <button onclick="mostrar()">Ver divisores</button>
    <div id="div_result"></div>
</body>
<script>
    function mostrar() {
        let num = Number(ipt_num.value);

        let count = 1;
        while(count <= num){
            if(num % count == 0){
                div_result.innerHTML += `${count} <br>`
            }
            count++;
        }
    }
</script>

</html>
