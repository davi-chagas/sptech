<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3</title>
</head>

<body>

    <h1>Futebol</h1>

    <span>Nome do time:</span>
    <input type="text" name="" id="input_nome">

    <span>Quantidade de títulos:</span>
    <input type="text" name="" id="input_quantidade_titulos">

    <button onclick="calcular()">Amo meu time</button>

</body>

<script>
    function calcular() {
        alert('O time ' + input_nome.value + ' tem ' + input_quantidade_titulos.value + ' titulos')
    }
</script>

</html>
