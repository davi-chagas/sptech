<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
</head>

<body>
    <div id="div_contagem">Contador: 0</div>
    <button onclick="incrementar()">incrementar</button>
</body>

<script>
    let contador = 0;
    function incrementar() {
        contador = contador + 1;
        
        div_contagem.innerHTML += `<br> Contador: ${contador}`;
    }
</script>

</html>
