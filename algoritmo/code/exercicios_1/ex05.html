<body>

    <h1>Opinião da família</h1>

    <span>Sua nota na escola:</span>
    <input type="text" id="input_nota_escola">

    <button onclick="opiniaoAvo()">opinião da avó</button>
    <button onclick="opiniaoMae()">opinião da mãe</button>
</body>

<script>
    function opiniaoAvo() {
        alert('Muito bem, que neto inteligente, porque tirou ' + input_nota_escola.value)
    }

    function opiniaoMae() {
        alert('Não fez mais que tua obrigação com essa nota ' + input_nota_escola.value)
    }
</script>
