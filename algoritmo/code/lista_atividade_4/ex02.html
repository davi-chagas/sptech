<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 02</title>
</head>

<body>
    <h1>Controle de Refrigerante</h1>

    <span>Digite a quantidade de latinhas consumidas por dia: </span>
    <input type="text" id="ipt_qtd_latinhas"> <br>

    <button onclick="calcular()">Quantos refris?</button>

    <div id="div_result">

    </div>
</body>
<script>
    function calcular() {
        let qtd_latinhas = Number(ipt_qtd_latinhas.value);
        let resultado = qtd_latinhas * 365;

        div_result.innerHTML = `Você consome ${resultado} por ano <br>`;
        if (resultado >= 500) {
            div_result.innerHTML += `Cuidado com as diabetes!`
        }
    }
</script>

</html>
