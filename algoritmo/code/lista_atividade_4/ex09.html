<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 09</title>
</head>

<body>
    <h1>Controle de horas assistindo streaming</h1>

    <span>Insira a ultima serie que assistiu: </span>
    <input type="text" id="ipt_serie"> <br>

    <span>Insira a quantidade de episodios ja assistidos: </span>
    <input type="text" id="ipt_qtd_eps"> <br>

    <button onclick="verificarNivel()">Verificar Nivel</button>

    <div id="div_result"></div>
</body>
<script>
    function verificarNivel() {
        let serie = ipt_serie.value;
        let qtd_eps = Number(ipt_qtd_eps.value);

        // 22 * 81 == 1800 Min == 30hrs

        div_result.innerHTML = `Vejo que você gosta da série ${serie} <br>`;
        if (qtd_eps > 81) {
            div_result.innerHTML += `<br> Uau, você realmente gosta dessa série!`
        }

    }
</script>

</html>
