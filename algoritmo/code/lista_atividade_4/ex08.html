<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 08</title>
</head>

<body>
    <h1>Controle de peso no elevador</h1>

    <span>Insira a quantidade de homens que entraram no elevador</span>
    <input type="text" id="ipt_qtd_homens"> <br>

    <span>Insira a quantidade de mulheres que entraram no elevador</span>
    <input type="text" id="ipt_qtd_mulheres"> <br>

    <button onclick="analisarPeso()">Analisar peso</button>

    <div id="div_result"></div>
</body>

<script>
    function analisarPeso() {
        let qtd_homens = Number(ipt_qtd_homens.value);
        let qtd_mulheres = Number(ipt_qtd_mulheres.value);
        let analise_peso = (qtd_homens * 80) + (qtd_mulheres * 60);

        div_result.innerHTML = `Este elevador suporta 800 Kg e o peso estimado desta lotação é de ${analise_peso}kg`

        if (analise_peso > 800) {
            div_result.innerHTML += `<br> Será necessário que alguém desça para que o elevador se movimente`;
        }
    }
</script>

</html>
