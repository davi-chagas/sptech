<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 05</title>
</head>

<body>
    <h1>Conta de luz</h1>

    <label for="ipt_kwh">Insira a qtd. kwh consumida no mês: </label>
    <input type="text" id="ipt_kwh"> <br>

    <button onclick="calcular()">Calcular conta de luz</button>

    <div id="div_result"></div>
</body>

<script>
    function calcular() {
        let kwh = Number(ipt_kwh.value);
        let valor_kwh = kwh * 0.85;

        if (kwh < 100) {
            let valor_desconto = kwh * 0.85 - (kwh * 0.1)
            div_result.innerHTML = `O valor da conta a ser paga é: R$${(valor_desconto).toFixed(2)}`
        } else {
            div_result.innerHTML = `O valor da conta a ser paga é: R$${valor_kwh}`
        }
    }
</script>

</html>
