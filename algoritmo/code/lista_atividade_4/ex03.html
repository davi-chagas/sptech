<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 03</title>
</head>

<body>
    <h1>Controle de notas </h1>

    <label for="ipt_n1">Insira o valor da primeira nota: </label>
    <input type="text" id="ipt_n1"> <br>

    <label for="ipt_n2">Insira o valor da segunda nota: </label>
    <input type="text" id="ipt_n2"> <br>

    <label for="ipt_n3">Insira o valor da terceira nota: </label>
    <input type="text" id="ipt_n3"> <br>

    <button onclick="calcularDesempenho()">Calcular Desempenho</button>

    <div id="div_result">

    </div>
</body>
<script>
    function calcularDesempenho() {
        let n1 = Number(ipt_n1.value);
        let n2 = Number(ipt_n2.value);
        let n3 = Number(ipt_n3.value);

        let media = (n1 + n2 + n3) / 3;

        div_result.innerHTML = `Sua média foi de ${(media).toFixed(2)} <br>`

        if (media > 9.4) {
            div_result.innerHTML += `Parabéns, você é fora de série`
        }

    }
</script>


</html>
