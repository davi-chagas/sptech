<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Json Contatos</title>
</head>

<body>
    Nome:
    <input type="text" id="ipt_nome"> <br>

    Telefone
    <input type="text" id="ipt_telefone"> <br>

    Rua
    <input type="text" id="ipt_rua"> <br>

    Cep
    <input type="text" id="ipt_cep"> <br>


    <button onclick="registrar()">Registrar Contato</button>
    <button onclick="exibir()">Exibir</button>

    <div id="div_result"></div>
</body>
<script>
    let contatos = [];

    function registrar() {
        let nome = ipt_nome.value;
        let telefone = ipt_telefone.value;
        let rua = ipt_rua.value;
        let cep = ipt_cep.value;

        let contato = {
            nome,
            telefone: telefone,
            endereco: {
                rua,
                cep: cep
            }
        }

        console.log(contato)
        contatos.push(contato)
    }

    function exibir() {
        let msg = '';

        for (let i = 0; i < contatos.length; i++) {
            let contato_atual = contatos[i];
            msg += `
            COntato ${i + 1} <br>
            Nome: ${contato_atual.nome} <br>
            Telefone: ${contato_atual.telefone}<br>
            Endereço: Rua: ${contato_atual.endereco.rua} | Cep: ${contato_atual.endereco.cep}`
        }

        div_result.innerHTML = msg;
    }

</script>

</html>
