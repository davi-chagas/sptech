<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 01</title>
</head>
<body>
    <h1>Contagem Simples</h1>

    <button onclick="count()">contar</button>

    <div id="div_result"></div>
</body>
<script>
    function count(){
        for(let i = 1; i <= 15; i++){
            div_result.innerHTML += `${i} <br>`
        }
    }
</script>
</html>
