<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 10</title>
</head>
<body>
    <h1>Pares no intervalo</h1>


    <label for="ipt_interval">Insira um intervalo: </label>
    <input type="text" id="ipt_interval">

    <button onclick="even()">S2 pares</button>

    <div id="div_result"></div>
</body>
<script>
    function even(){
        let interval = Number(ipt_interval.value);

        div_result.innerHTML = '';

        for(let i = 0; i <= interval; i ++){
            if(i % 2 == 0){
                div_result.innerHTML += `${i} <br>`
            }
        }
    }
</script>
</html>
