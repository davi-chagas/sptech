<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 11</title>
</head>

<body>
    <h1>Tabuada colorida</h1>

    <select id="select_multiplication_table">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
    </select>

    <label for="ipt_num">Até que número deve ser construida: </label>
    <input type="text" id="ipt_num"> <br>

    <button onclick="calc()">Ver Tabuada</button>
    <div id="div_result"></div>
</body>
<script>
    function calc() {
        let table = Number(select_multiplication_table.value);
        let num = Number(ipt_num.value);

        for (let i = 1; i <= num; i++) {
            if (i % 2 == 0) {
                div_result.innerHTML += `<span style='color:blue;'>${table} x ${i} = ${table * i} <br></span>`
            } else {
                div_result.innerHTML += `<span style='color:red;'>${table} x ${i} = ${table * i} <br></span>`
            }
        }
    }
</script>

</html>
