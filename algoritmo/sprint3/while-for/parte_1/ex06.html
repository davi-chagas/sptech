<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 06</title>
</head>

<body>
    <h1>Filtro de números cabalísticos</h1>

    <button onclick="filter()">Filtrar</button>

    <div id="div_result"></div>
</body>
<script>
    function filter() {
        for (let i = 1; i <= 30; i++) {
            if(i != 4 && i != 7 && i != 10 && i != 12){
                div_result.innerHTML += `${i} <br>`
            }
        }
    }
</script>

</html>
