<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 03</title>
</head>
<body>
    <h1> Cadastro de Alunos com Exibição Invertida</h1>

    <label for="name_student">Insira o nome do aluno: </label>
    <input type="text" id="ipt_name_student">

    <button onclick="insert()">Cadastrar</button>

    <div id="div_result"></div>
</body>
<script>
    let student_list = [];

    function insert(){
        student_list.push(ipt_name_student.value);

        div_result.innerHTML = '';

        for(let i = student_list.length - 1; i >= 0; i-- ){
            div_result.innerHTML += `${student_list[i]} <br>`
        }

    }


</script>
</html>
