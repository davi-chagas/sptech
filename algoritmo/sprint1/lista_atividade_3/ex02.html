<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 02</title>
</head>
<body>
    
    <h1>Dividindo a Pizza</h1>

    <span>Insira o valor da pizza: </span>
    <input type="text" id="input_valor"> <br>

    <span>Insira a quantidade de pessoas: </span>
    <input type="text" id="input_qtd_pessoas">

    <button onclick="calcular()">#lovePizza</button>

    <div id="div_result">
        <!-- conteudo -->
    </div>

</body>

<script>
    function calcular(){
        div_result.innerHTML = `Cada um dos ${input_qtd_pessoas.value} amigos vai pagar R$${(input_valor.value / input_qtd_pessoas.value).toFixed(2)}`
    }
</script>
</html>
