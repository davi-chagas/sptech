<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3</title>
</head>
<body>
    <h1>Sensação Térmica: Como o Corpo Humano Percebe a Temperatura</h1>

    <label for="ipt_temperatura">Insira a temperatura :</label>
    <input type="text" id="ipt_temperatura">

    <button onclick="analisar()">Analisar</button>

    <div id="div_result"></div>
</body>

<script>
    function analisar(){
        let temperatura = Number(ipt_temperatura.value);

        if(temperatura < 14){
            div_result.innerHTML = 'Congelante';
        } else if (temperatura <= 21) {
            div_result.innerHTML = 'Com frio'
        } else if(temperatura <= 24){
            div_result.innerHTML = 'Com calor'
        } else {
            div_result.innerHTML = 'Calor escaldante'
        }
    }
</script>
</html>
