<body>
    <h1>Imagem do Pokémon selecionado </h1>

    <label for="select_result">Opções: </label>
    <select id="select_result">
        <option selected disabled>Selecione uma opção</option>
        <option value="bulbasaur.png">Bulbasaur</option>
        <option value="chamander.png" />Charmander</option>
        <option value="squirtle.png">Squirtle</option>
    </select>

    <button onclick="mostrarPokemon()">Enviar</button>

    <div id="div_result"></div>
</body>

<script>

        let pokemon = select_result.value;

        if (pokemon == 'bulbasaur.png') {

        } else if (pokemon == 'chamander.png') {
