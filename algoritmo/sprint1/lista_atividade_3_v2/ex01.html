<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 01</title>
</head>

<body>
    <h1>Calculadora Básica</h1>

    <span>Insira o primeiro número: </span>
    <input type="text" id="ipt_n1"> <br>

    <span>Insira o segundo número: </span>
    <input type="text" id="ipt_n2"> <br>

    <button onclick="calcularSoma()">Somar</button>
    <button onclick="calcularProduto()">Multiplicar</button>
    <button onclick="calcularRazao()">Dividir</button>
    <button onclick="calcularDiferenca()">Subtrair</button>

    <div id="div_result">

    </div>


</body>

<script>

    function calcularSoma() {
        let n1 = Number(ipt_n1.value);
        let n2 = Number(ipt_n2.value);
        let resultado = n1 + n2;
        div_result.innerHTML = `<br> A soma entre ${n1} e ${n2} é ${resultado}`
    }

    function calcularDiferenca() {
        let n1 = Number(ipt_n1.value);
        let n2 = Number(ipt_n2.value);
        let resultado = n1 - n2;
        div_result.innerHTML = `<br> A diferença entre ${n1} e ${n2} é ${resultado}`

    }

    function calcularProduto() {
        let n1 = Number(ipt_n1.value);
        let n2 = Number(ipt_n2.value);
        let resultado = n1 * n2;
        div_result.innerHTML = `<br> O produto entre ${n1} e ${n2} é ${resultado}`

    }

    function calcularRazao() {
        let n1 = Number(ipt_n1.value);
        let n2 = Number(ipt_n2.value);
        let resultado = n1 / n2;
        div_result.innerHTML = `<br> A razão entre ${n1} e ${n2} é ${resultado}`

    }
</script>

</html>
