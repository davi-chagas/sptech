<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varivael</title>
</head>

<body>
    <span>Número 1: </span>
    <input type="text" id="ipt_n1"> <br>

    <span>Número 2: </span>
    <input type="text" id="ipt_n2"> <br>

    <button onclick="calcularMedia()">Calcular média</button>

    <div id="div_result">

    </div>
</body>

<script>
    function calcularMedia() {
        let n1 = Number(ipt_n1.value);
        let n2 = Number(ipt_n2.value);
        let media = (n1 + n2) / 2;
        div_result.innerHTML = `A média entre ${n1} e ${n2} é: ${media}`
    }
</script>

</html>
