<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
</head>

<body>

    <h1>Calculadora de Peso e Altura </h1>

    <span>Peso:</span>
    <input type="text" id="input_peso">

    <span>Altura:</span>
    <input type="text" id="input_altura">

    <button onclick="pesar()">Fale comigo</button>


</body>

<script>
    function pesar() {
        alert('Você pesa ' + input_peso.value + ' kg' + ' e tem ' + input_altura.value + ' m de altura')
    }
</script>

</html>
